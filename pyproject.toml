[project]
name = "open-econs"
version = "1.3.0"
description = "Empirical economics and causal inference in Python - a scikit-learn-style unified API with Stata/R-grade numerical parity."
keywords = [
    "econometrics",
    "economics",
    "causal inference",
    "stata",
    "r",
    "difference-in-differences",
    "synthetic control",
    "panel data",
    "regression discontinuity",
    "instrumental variables",
    "gmm",
    "time series",
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "formulaic>=1.0",
    "scipy>=1.11",
    "linearmodels>=6.0",
    "jinja2>=3.0",
    "pyfixest==0.60.0",
    "arch>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "hypothesis>=6.0", "sympy>=1.12"]
lint = ["mypy>=1.8", "ruff>=0.3"]
plot = ["matplotlib>=3.8"]
rd = ["rdrobust>=2.0", "rddensity>=2.0"]
nls = ["sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/qmanhbeo/open-econs"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
# Default run now executes the full suite, including the Stata/R-backed parity
# tests, all of which read committed fixtures only (run_do() is gated behind
# OE_REGENERATE_FIXTURES, so no Stata/R binary is ever launched in a default
# run). The `-m "not stata and not r"` expression is kept available as an
# explicit opt-in fast mode for quick local iteration; the `stata`/`r` markers
# themselves remain defined. See TESTING.md.
addopts = "--ignore=tests/stata/generate-fixtures/archive"
markers = [
    "stata: marks tests that compare against Stata-generated .dta fixtures (require Stata to regenerate; excluded by default historically, now run in the default suite against committed fixtures)",
    "r: marks tests that compare against R-generated output via Rscript (require R; excluded by default historically, now run in the default suite against committed fixtures)",
    "slow: marks tests whose runtime is materially higher than the typical test (e.g. multi-start / multi-method solver sweeps). They run in the default local suite (bare `pytest`) AND in a dedicated CI job, so coverage is unchanged; the split exists only to give a fast feedback path (CI 'fast' step) without dropping coverage.",
    "synth_placebo: marks tests for synthetic control and placebo inference. Excluded from default runs via pytest -m 'not synth_placebo'.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"