name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Full suite: the default `pytest tests/` run now executes everything
      # (607 tests), including the Stata/R-backed parity tests. All parity tests
      # read committed .dta fixtures only — `run_do()` is gated behind
      # OE_REGENERATE_FIXTURES, so no Stata/R binary is launched on CI (which has
      # none installed anyway). A drift check inside the parity tests fails the
      # build if any .do file is newer than its committed .dta. The `-m "not
      # stata and not r"` opt-in fast mode remains available for local use.
      - name: Run full test suite (committed-fixture fallback, no Stata/R binaries)
        run: python -m pytest tests/ --cov=open_econs --cov-report=term-missing -v --tb=short