name: CI

on:
  push:
    branches: [main, fix/synth-cross-os-solver]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Cache mypy incremental results
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Tiering: ONLY the fast path (`pytest -m "not slow"`) runs on every
      # push/PR. The `slow` marker (the multi-method V-optimization synth
      # placebo sweeps) is run by a SEPARATE workflow (ci-slow.yml) on a nightly
      # cron and manual `workflow_dispatch`, so it stays a safety net without
      # gating every PR. Bare local `pytest` still runs everything (default
      # addopts are unchanged) — this split is a CI feedback optimization, not a
      # coverage reduction for local runs.
      #
      # Coverage: Python 3.12 keeps `--cov` (line-level coverage gathered every
      # PR); Python 3.13 deliberately runs WITHOUT `--cov`. On 3.13 coverage.py's
      # PEP 669 `sys.monitoring` path adds ~60% overhead to the test step
      # (~157s), vs only ~6% on 3.12 — see
      # docs/synth-cross-os-solver-recon-update.md. This is a disclosed per-PR
      # coverage tradeoff (3.13-only paths lose live coverage reporting), not a
      # reduction in test execution.
      - name: Select coverage flag (3.13 runs without --cov for speed)
        id: covflag
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            echo "cov=" >> "$GITHUB_OUTPUT"
          else
            echo "cov=--cov=open_econs --cov-report=term-missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fast test suite (not slow)
        run: python -m pytest -m "not slow" tests/ ${{ steps.covflag.outputs.cov }} -v --tb=short
