name: CI

on:
  push:
    branches: [main, fix/synth-cross-os-solver]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Cache mypy incremental results
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Tiering: ONLY the fast path (`pytest -m "not slow"`) runs on every
      # push/PR. The `slow` marker (the multi-method V-optimization synth
      # placebo sweeps) is run by a SEPARATE workflow (ci-slow.yml) on a nightly
      # cron and manual `workflow_dispatch`, so it stays a safety net without
      # gating every PR. Bare local `pytest` still runs everything (default
      # addopts are unchanged) — this split is a CI feedback optimization, not a
      # coverage reduction for local runs.
      #
      # Coverage: line-level coverage is gathered every PR (single 3.10 job
      # keeps `--cov`; no 3.13 PEP 669 overhead tradeoff to manage).
      - name: Select coverage flag
        id: covflag
        run: echo "cov=--cov=open_econs --cov-report=term-missing" >> "$GITHUB_OUTPUT"

      - name: Run fast test suite (not slow)
        run: python -m pytest -m "not slow" tests/ ${{ steps.covflag.outputs.cov }} -v --tb=short
