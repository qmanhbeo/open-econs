name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Default suite: excludes Stata/R-backed parity tests (the `-m "not stata
      # and not r"` addopts in pyproject.toml), so no Stata/R binary is needed.
      - name: Run default test suite (no Stata/R binaries)
        run: python -m pytest tests/ --cov=open_econs --cov-report=term-missing -v --tb=short

      # Parity suite: explicitly selects the `stata`/`r` tests (this overrides the
      # default addopts). On CI there is no StataMP/R, so committed .dta fixtures
      # are read directly (fallback mode) and binary-gated tests skip cleanly. A
      # drift check fails the build if any .do file is newer than its .dta.
      # Combined with the default run this preserves the full pre-change test set.
      - name: Run Stata/R parity tests (committed-fixture fallback)
        run: python -m pytest -m "stata or r" tests/ -v --tb=short