name: CI

on:
  push:
    branches: [main, fix/synth-cross-os-solver]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Tiering: ONLY the fast path (`pytest -m "not slow"`) runs on every
      # push/PR so a typical push gets feedback in ~3 minutes, matching main.
      # The `slow` marker (currently the multi-method V-optimization synth
      # placebo sweeps) is run by a SEPARATE workflow (ci-slow.yml) on a nightly
      # cron and manual `workflow_dispatch`, so it stays a safety net without
      # gating every PR. Bare local `pytest` still runs everything (default
      # addopts are unchanged) — this split is a CI feedback optimization, not a
      # coverage reduction for local runs.
      - name: Run fast test suite (not slow)
        run: python -m pytest -m "not slow" tests/ --cov=open_econs --cov-report=term-missing -v --tb=short
