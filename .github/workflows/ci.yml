name: CI

on:
  push:
    branches: [main, fix/synth-cross-os-solver]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Tiering: split the default suite into a fast path and a slow path so a
      # typical push gets feedback in ~2 minutes while coverage is unchanged.
      # The `slow` marker is applied to tests whose runtime is materially higher
      # than the typical test (currently the multi-method V-optimization synth
      # placebo sweeps). BOTH steps run on every push/PR. Bare local `pytest`
      # still runs everything (default addopts are unchanged) — this split is a
      # CI feedback optimization, not a coverage reduction.
      - name: Run fast test suite (not slow)
        run: python -m pytest -m "not slow" tests/ --cov=open_econs --cov-report=term-missing -v --tb=short

      - name: Run slow test suite (marked slow)
        run: python -m pytest -m "slow" tests/ --cov=open_econs --cov-report=term-missing -v --tb=short
