name: CI

on:
  push:
    branches: [main, fix/synth-cross-os-solver]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Cache mypy incremental results
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Lint with ruff
        run: ruff check open_econs/

      - name: Type-check with mypy
        run: mypy open_econs/ --ignore-missing-imports

      # Tiering: ONLY the fast path (`pytest -m "not slow and not
      # synth_placebo"`) runs on every push/PR. The `slow` marker (the
      # multi-method V-optimization synth placebo sweeps) and the
      # `synth_placebo` marker (ADH placebo / permutation inference) are run by
      # the nightly workflow (ci-nightly.yml, bare `pytest`) on a cron and manual
      # `workflow_dispatch`, so they stay a safety net without gating every PR.
      # Bare local `pytest` still runs everything (default addopts are unchanged)
      # — this split is a CI feedback optimization, not a coverage reduction for
      # local runs.
      #
      # Coverage: the min supported Python (3.10) keeps `--cov` (line-level
      # coverage gathered every PR); the max (3.13) deliberately runs WITHOUT
      # `--cov`. On 3.13 coverage.py's
      # PEP 669 `sys.monitoring` path adds ~60% overhead to the test step
      # (~157s), vs only ~6% on 3.10 — see
      # docs/synth-cross-os-solver-recon-update.md. This is a disclosed per-PR
      # coverage tradeoff (3.13-only paths lose live coverage reporting), not a
      # reduction in test execution.
      - name: Select coverage flag (3.13 runs without --cov for speed)
        id: covflag
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            echo "cov=" >> "$GITHUB_OUTPUT"
          else
            echo "cov=--cov=open_econs --cov-report=term-missing" >> "$GITHUB_OUTPUT"
          fi

      # `synth_placebo` is excluded here (in addition to `slow`) per AGENTS.md
      # rule 5: the ADH placebo / permutation tests are SLSQP-driven and behave
      # differently across Python builds (they ran on 3.10 but not consistently
      # on 3.13, producing a spurious per-version selection difference). They are
      # a safety net, not a per-PR gate — the nightly `ci-nightly.yml` (bare
      # `pytest`) still runs them in full. Keeping both markers out here makes the
      # 3.10 and 3.13 legs select an identical, deterministic test set.
      - name: Run fast test suite (not slow, not synth_placebo)
        run: python -m pytest -m "not slow and not synth_placebo" tests/ ${{ steps.covflag.outputs.cov }} -v --tb=short
