name: Slow Tests

# Runs the `slow`-marked test suite (currently the multi-method V-optimization
# synth placebo sweeps) on a nightly schedule and on manual dispatch.
#
# Deliberately does NOT run on push or pull_request: the fast path in ci.yml
# is the sole gate on every push/PR (~3 minutes, matching main). This workflow
# is the automated safety net that keeps the slow tests covered even though
# they no longer run on every PR.
on:
  schedule:
    # Nightly at 03:17 UTC (non-round minute avoids the top-of-hour stampede).
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,lint,plot]"

      - name: Run slow test suite (marked slow)
        run: python -m pytest -m "slow" tests/ --cov=open_econs --cov-report=term-missing -v --tb=short
