name: Generate R fixtures (manual)

# MANUAL ONLY. Triggered exclusively via `workflow_dispatch` from the Actions
# tab. It is deliberately NOT bound to `push`/`pull_request`, so it never runs
# as part of routine CI and never adds an R dependency to PR checks (the normal
# CI pipeline has no R and must stay that way).
#
# Purpose: regenerate the R-side expected-output JSON fixtures for the rank-
# deficient synthetic-control parity tests on Linux, so they match the Python
# estimator on CI's OS/BLAS. The committed R fixtures are OS-sensitive for the
# nonconvex-V rank-deficient cases (Python's scipy SLSQP and R's kernlab::ipop
# land on different local optima across OS/BLAS), so the reference fixtures must
# be produced on the same OS the Python side is compared against.
#
# Usage:
#   gh workflow run generate-r-fixtures.yml --ref <branch>
# then download the `r-fixtures-linux` artifact and commit the JSON files.

on:
  workflow_dispatch:

jobs:
  generate-r-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages (Synth / jsonlite / nnet)
        run: |
          Rscript -e 'install.packages(c("Synth", "jsonlite", "nnet"), repos = "https://cloud.r-project.org")'

      - name: Regenerate rank-deficient R fixtures (Linux)
        run: |
          Rscript tests/r/do/synth_parity_underdetermined.R \
            tests/r/fixtures/synth_parity_underdetermined_input.csv \
            tests/r/fixtures/synth_parity_underdetermined.json
          Rscript tests/r/do/synth_placebo_space.R \
            tests/r/fixtures/synth_placebo_space_input.csv \
            tests/r/fixtures/synth_placebo_space.json

      - name: Upload regenerated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: r-fixtures-linux
          path: |
            tests/r/fixtures/synth_parity_underdetermined.json
            tests/r/fixtures/synth_placebo_space.json
          if-no-files-found: error
